  - {skill_id: experiment-schematic-director, trigger: experiment_setup, do_not_trigger: fabrication_chronology_or_photo_replacement, inputs: [ScientificFigureSpec], required_context: [variables, controls, instrumentation], workflow: [validate_method, specify_stack], allowed_downstream: [vector-figure-builder], forbidden_actions: [omit_controls, absorb_fabrication], output_contract: ScientificFigureSpec, provenance_behavior: stage_bound, failure_modes: [missing_method], blocked_states: [blocked_missing_provenance], handoff_target: vector-figure-builder, qa_owner: figure-critic}
  - {skill_id: fabrication-process-director, trigger: fabrication_process, do_not_trigger: mechanism_or_measurement_schematic, inputs: [ScientificFigureSpec], required_context: [process_steps, material_refs], workflow: [preserve_order, preserve_unknowns], allowed_downstream: [vector-figure-builder], forbidden_actions: [invent_conditions, absorb_mechanism], output_contract: ScientificFigureSpec, provenance_behavior: process_bound, failure_modes: [invalid_order], blocked_states: [blocked_missing_provenance], handoff_target: vector-figure-builder, qa_owner: provenance-qa}
  - {skill_id: scientific-plot-director, trigger: quantitative_measured_result, do_not_trigger: conceptual_or_raster_only_request, inputs: [ScientificFigureSpec], required_context: [data_provenance, units], workflow: [validate_data, specify_vector_plot], allowed_downstream: [FigureOutputManifest], forbidden_actions: [ai_generation, raster_only_output], output_contract: FigureOutputManifest, provenance_behavior: data_bound, failure_modes: [missing_data], blocked_states: [blocked_missing_provenance], handoff_target: FigureOutputManifest, qa_owner: provenance-qa}
  - {skill_id: photo-annotation-director, trigger: real_experiment_photo, do_not_trigger: generated_substitute, inputs: [ScientificFigureSpec], required_context: [source_asset], workflow: [preserve_source, specify_overlay], allowed_downstream: [FigureOutputManifest], forbidden_actions: [replace_source, ai_generation], output_contract: FigureOutputManifest, provenance_behavior: source_asset_bound, failure_modes: [missing_source_asset], blocked_states: [blocked_missing_provenance], handoff_target: FigureOutputManifest, qa_owner: provenance-qa}
  - {skill_id: literature-figure-director, trigger: literature_figure, do_not_trigger: ai_recreation, inputs: [ScientificFigureSpec], required_context: [citation, extracted_source], workflow: [validate_citation, specify_overlay], allowed_downstream: [FigureOutputManifest], forbidden_actions: [ai_recreation], output_contract: FigureOutputManifest, provenance_behavior: citation_bound, failure_modes: [missing_citation], blocked_states: [blocked_missing_provenance], handoff_target: FigureOutputManifest, qa_owner: provenance-qa}
  - {skill_id: comparison-figure-director, trigger: fair_comparison, do_not_trigger: single_result, inputs: [ScientificFigureSpec], required_context: [panel_bindings, scales], workflow: [validate_fairness, specify_panels], allowed_downstream: [vector-figure-builder], forbidden_actions: [scale_manipulation], output_contract: ScientificFigureSpec, provenance_behavior: evidence_bound, failure_modes: [missing_panel_binding], blocked_states: [blocked_missing_provenance], handoff_target: vector-figure-builder, qa_owner: figure-critic}
  - {skill_id: image-matrix-director, trigger: image_matrix, do_not_trigger: arbitrary_collage, inputs: [ScientificFigureSpec], required_context: [panel_order, scales], workflow: [validate_order, specify_matrix], allowed_downstream: [vector-figure-builder], forbidden_actions: [reorder_panels, lose_scale], output_contract: ScientificFigureSpec, provenance_behavior: source_asset_bound, failure_modes: [missing_panel], blocked_states: [blocked_missing_provenance], handoff_target: vector-figure-builder, qa_owner: figure-critic}
  - {skill_id: concept-illustration-director, trigger: organic_non_evidence_concept, do_not_trigger: empirical_or_literature_visual, inputs: [ScientificFigureSpec], required_context: [non_evidence_status], workflow: [validate_non_evidence, request_substrate], allowed_downstream: [FigureOutputManifest], forbidden_actions: [claim_support, empirical_binding], output_contract: FigureOutputManifest, provenance_behavior: generation_bound, failure_modes: [evidence_masquerade], blocked_states: [blocked_non_evidence_boundary], handoff_target: FigureOutputManifest, qa_owner: provenance-qa}
  - {skill_id: vector-figure-builder, trigger: approved_vector_spec, do_not_trigger: raw_scientific_prose, inputs: [ScientificFigureSpec], required_context: [governed_style], workflow: [compose_deterministically], allowed_downstream: [FigureOutputManifest], forbidden_actions: [invent_science], output_contract: FigureOutputManifest, provenance_behavior: spec_hash_bound, failure_modes: [missing_style], blocked_states: [blocked_missing_provenance], handoff_target: FigureOutputManifest, qa_owner: figure-critic}
  - {skill_id: visual-style-governor, trigger: style_token_request, do_not_trigger: standalone_art_creation, inputs: [FigureProductionPlan], required_context: [cp3_style_profile], workflow: [resolve_governed_tokens], allowed_downstream: [style-resolution-consumer], forbidden_actions: [invent_material_color], output_contract: style_resolution, provenance_behavior: profile_bound, failure_modes: [unresolved_token], blocked_states: [blocked_unresolved_style], handoff_target: style-resolution-consumer, qa_owner: provenance-qa}
