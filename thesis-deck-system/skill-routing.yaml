  - {skill_id: layout-director, trigger: approved_figure, do_not_trigger: raw_spec_or_unapproved_asset, inputs: [APPROVED_FIGURE], required_context: [slide_spec, layout_plan], workflow: [place_finished_asset], allowed_downstream: [PythonPptxAssembler], forbidden_actions: [create_or_repair_figure], output_contract: layout_plan, provenance_behavior: approved_asset_bound, failure_modes: [missing_approval], blocked_states: [blocked_figure_critic], handoff_target: PythonPptxAssembler, qa_owner: provenance-qa}
  - {skill_id: provenance-qa, trigger: figure_contract, do_not_trigger: asset_creation, inputs: [FigureProductionPlan], required_context: [source_claim_evidence_refs], workflow: [resolve_chain, report], allowed_downstream: [FigureOutputManifest], forbidden_actions: [fabricate_source], output_contract: FigureOutputManifest, provenance_behavior: chain_validation, failure_modes: [dangling_ref], blocked_states: [blocked_missing_provenance], handoff_target: FigureOutputManifest, qa_owner: provenance-qa}
handoff_graph:
  - scientific_state
  - FigureProductionPlan
  - selected_specialist_director
  - FigureOutputManifest
  - figure-critic
  - APPROVED_FIGURE
  - layout-director
