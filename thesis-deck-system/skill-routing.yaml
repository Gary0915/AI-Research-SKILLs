schema_version: "4.0.0"
registry_id: CP4-SKILL-REGISTRY-001
routes:
  更新這週 Group Meeting:
    top_level: thesis-deck-router
    handoff: [master-deck-ledger, hypothesis-layer-planner, scientific-figure-router, professor-qa]
  新增一個 Hypothesis:
    top_level: thesis-deck-router
    handoff: [scientific-method-planner, hypothesis-layer-planner, master-deck-ledger, scientific-figure-router, professor-qa]
  整理這批實驗數據成結果頁:
    top_level: thesis-deck-router
    handoff: [scientific-method-planner, master-deck-ledger, scientific-figure-router, professor-qa]
  畫目前研究魚骨圖:
    top_level: thesis-deck-router
    handoff: [master-deck-ledger, scientific-figure-router, professor-qa]
  做文獻與機制頁:
    top_level: thesis-deck-router
    handoff: [scientific-method-planner, scientific-figure-router, professor-qa]
  更新 Master Deck:
    top_level: thesis-deck-router
    handoff: [master-deck-ledger, hypothesis-layer-planner, scientific-figure-router, professor-qa]
  審核這份簡報:
    top_level: thesis-deck-router
    handoff: [professor-qa]
skills:
  - {skill_id: thesis-deck-router, trigger: ledger_slide_request, do_not_trigger: raw_fixture_or_private_style, inputs: [materialized_state], required_context: [source_cursor], workflow: [validate, route], allowed_downstream: [scientific-figure-router], forbidden_actions: [draw_figures], output_contract: FigureProductionPlan, provenance_behavior: cursor_bound, failure_modes: [missing_ref], blocked_states: [blocked_missing_provenance], handoff_target: scientific-figure-router, qa_owner: provenance-qa}
