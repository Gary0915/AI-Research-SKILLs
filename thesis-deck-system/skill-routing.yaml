  - {skill_id: fishbone-director, trigger: fishbone_history, do_not_trigger: unversioned_map, inputs: [ScientificFigureSpec], required_context: [fishbone_revision, focus_ref], workflow: [validate_history, style_only], allowed_downstream: [vector-figure-builder], forbidden_actions: [mutate_history], output_contract: ScientificFigureSpec, provenance_behavior: revision_bound, failure_modes: [missing_revision], blocked_states: [blocked_missing_provenance], handoff_target: vector-figure-builder, qa_owner: provenance-qa}
