[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-deck-system"
version = "0.1.0"
description = "Contract-first thesis deck vertical slice"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "Pillow>=10.0",
  "python-pptx>=1.0",
  "lxml>=5.0",
]

[project.scripts]
thesis-deck = "thesis_deck_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

